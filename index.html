<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vector Tile Map</title>
    <!-- <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script> -->
    <script src="maplibre/maplibre.js"></script>
    <!-- <link
      href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css"
      rel="stylesheet"
    /> -->
    <link href="maplibre/maplibre.css" rel="stylesheet" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #map {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script>
      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          glyphs: "http://localhost:3000/fonts/{fontstack}/{range}.pbf",

          sources: {
            vector_tiles: {
              type: "vector",
              tiles: ["http://localhost:3000/tiles/{z}/{x}/{y}.pbf"],
              minzoom: 0,
              maxzoom: 16,
            },
          },

          layers: [
            // Background
            {
              id: "background",
              type: "background",
              paint: { "background-color": "#e0e0d6" },
            },

            // Buildings (fill)
            {
              id: "buildings",
              type: "fill",
              source: "vector_tiles",
              "source-layer": "buildings",
              paint: {
                "fill-color": "#bbb",
                "fill-opacity": 0.7,
              },
            },
          ],
        },

        center: [51.41, 35.7], // Tehran
        zoom: 2,
      });
    </script>
  </body>
</html>
