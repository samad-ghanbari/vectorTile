<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <link href="maplibre/maplibre.css" rel="stylesheet" />

    <style>
      body {
        margin: 0;

      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 90%;

  </head>
  <body>
    <div id="map"></div>
    <script>
      maplibregl.setRTLTextPlugin("maplibre/mapbox-rtl-text.js", null, true);

      const map = new maplibregl.Map({
        container: "map",
        style: "maplibre/style.json",
      });
      map.addControl(new maplibregl.NavigationControl());

      // new source and layer

      //           },

      //           },
      //         },
      //         {

      //           },
      //           properties: {
      //             name: "مرکز بهشتی",
      //           },
      //         },
      //       ],
      //     },
      //   });

      //   map.addLayer({
      //     id: "sitex-layer",
      //     type: "symbol",
      //     source: "sitex-source",
      //     layout: {
      //       "icon-image": "sitex-icon",
      //       "icon-size": 1,
      //       "text-field": ["get", "name"],
      //       "text-font": ["Noto Sans"],
      //       "text-offset": [0, 1.25],
      //       "text-anchor": "top",
      //       visibility: "visible",
      //     },
      //     paint: {
      //       "text-color": "hsl(210, 40%, 50%)",
      //       "text-halo-color": "hsla(0, 0%, 100%, 0.8)",
      //       "text-halo-width": 1,
      //     },
      //   });
      // });

      map.on("load", () => {
        map.addSource("sitex-source", {
          type: "geojson",
          data: {
            type: "FeatureCollection",
            features: [
              {
                type: "Feature",
                geometry: {
                  type: "Point",
                  coordinates: [51.4878798, 35.7781818],
                },
                properties: {
                  name: "مرکز لویزان",
                },
              },
              {
                type: "Feature",
                geometry: {
                  type: "Point",
                  coordinates: [51.451153, 35.729557],
                },
                properties: {
                  name: "مرکز بهشتی",
                },
              },
            ],
          },
        });

        map.addLayer({
          id: "sitex-layer",
          type: "symbol",
          source: "sitex-source",
          layout: {
            "icon-image": "public_building",
            "icon-size": 2,
            "text-field": ["get", "name"],
            "text-font": ["Noto Sans"],
            "text-size": 18,
            "text-offset": [0, 1.25],
            "text-anchor": "top",
            visibility: "visible",
          },
          paint: {
            "text-color": "black",
            "text-halo-color": "hsla(0, 0%, 100%, 0.8)",
            "text-halo-width": 2,
          },
        });
      });

      // add multiple markers
      new maplibregl.Marker({
        color: "#F00",
      })
        .setLngLat([51.49, 35.79])
        .setPopup(new maplibregl.Popup({ offset: 25 }).setText("مرکز 1"))
        .addTo(map);

      new maplibregl.Marker({
        color: "#F0F",
        draggable: true,
      })
        .setLngLat([51.4, 35.73])
        .setPopup(
          new maplibregl.Popup({ offset: 25, closeOnClick: false }).setHTML(
            `<a style='display: block; text-align: right;' href='/site/1'>ONU04</a> <button style='width: 200px;' onclick='console.log(12345);window.location.href="/site/2"'>سایت</button>`
          )
        )
        .addTo(map);

      new maplibregl.Marker()
        .setLngLat([51.55, 35.77])
        .setPopup(new maplibregl.Popup({ offset: 25 }).setText("مرکز 2"))
        .addTo(map);
    </script>
  </body>
</html>
